<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon PORTFOLIO</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
        <h1>Bienvenue sur mon PORTFOLIO</h1>
        <nav>
            <a href="#accueil">Accueil</a>
            <a href="#projets">Projets</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
      <!-- Section Accueil -->
        <section id="accueil">
            <h2 id="nom">Chargement...</h2>
            <h3 id="titre"></h3>
            <p id="description"></p>
            <p id="email"></p>
        </section>
        <!-- Section Projets -->
        <section id="projets">
            <h2>Mes Projets</h2>
            <div id="liste-projets">
                <p>Chargement des projets...</p>
            </div>
        </section>
        <!-- Section Contact -->
        <section id="contact">
          <h1>Contactez-moi</h1>
          <form id="form-contact">
            <input type="text" id="nom-contact" placeholder="Votre nom" required />
            <input type="email" id="email-contact" placeholder="Votre email" required />
            <input type="text" id="sujet-contact" placeholder="Sujet" required />
            <textarea id="message-contact" placeholder="Votre message" required></textarea>
            <button type="submit">Envoyer le message</button>
          </form>
        </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
